<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · Laboratorio Virtual</title>
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body>
    <header class="cabecera">
        <a class="cabecera__logo" href="../index.html">
            <img src="../img/logo.svg" alt="Logo del Laboratorio Virtual" width="40" height="40">
            <span> Laboratorio Virtual</span>
        </a>
        <nav class="cabecera__nav">
            <ul class="cabecera__menu">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="bloques.html">Bloques</a></li>
                <li><a href="preguntas.html">Preguntas</a></li>
                <li><a href="evaluacion.html">Evaluación</a></li>
                <li><a href="contacto.html" aria-current="page">Contacto</a></li>
            </ul>
        </nav>
        <button class="cabecera__hamburguesa" id="boton-menu" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </header>
    <main class="contenedor">
        <section class="contacto">
            <div class="contacto__info">
                <h1>Contacto</h1>
             <p>Si tienes alguna pregunta o comentario, no dudes en contactarnos.</p>
              <p class="contacto__correo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" aria-hidden="true">
                     <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="M3 7l9 6 9-6"/>
                 </svg>
                <a href="mailto:mtrigoitecherag@gmail.com">mtrigoitecherag@gmail.com</a>
              </p>
            </div>

            <form class="contacto__form" id="form-contacto" action="" method="post">
                <div class="fila">
                    <label class="solo lectores" for="nombre">Nombre:</label>
                    <input class="campo" type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                

                     <label class="solo lectores" for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Correo Electrónico" required>

                <label class="solo lectores" for="mensaje">Mensaje:</label>
                <textarea class="campo"id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí" required></textarea>

                <button class="boton boton__ancho" type="submit">Enviar</button>
                <p class="estado" id="estado" role="status"></p>
            </form>
    </main>
    <a class="tarjeta tarjeta--enlace" href="preguntas-frecuentes.html">
        <span class="tarjeta__icono" aria-hidden="true">?</span>
        <span>
          <strong>También puedes...</strong><br>
          Consultar nuestras preguntas frecuentes
        </span>
      </a>

    </section>
  </main>

  <script src="/main.js"></script>
  <script src="/js/contacto.js"></script>
    
</body>
</html>
